[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edudb-modular"
version = "0.1.0"
description = "A module-by-module educational database project."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edudb-modular = "edudb.__main__:main"

[tool.setuptools.packages.find]
include = ["edudb*"]
